<!doctype html>
<!-- krinomatrix.com 品牌首页：静态页，后端挂在 /landing/，Caddy 把 krinomatrix.com 转过去。两个入口：国内版 cn.krinomatrix.com、海外版 app.krinomatrix.com -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>决策矩阵 KRINO MATRIX</title>
  <meta name="description" content="KRINO MATRIX · KRINO WORLD — 和会记得你的 AI 角色聊天 / Chat with AI characters who remember you.">
  <link rel="icon" href="/static/assets/krino-mark.svg" type="image/svg+xml">
  <style>
    :root { --ink: #131319; --line: #2c2c38; --text: #ececf1; --muted: #8b8c9a; --silver: #b9bac7; --silver-hi: #e6e7ef; --cobalt: #1414a8; --cobalt-dk: #0c0c78; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--text); font: 15px/1.7 "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    main { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 1fr); }
    .art { background: radial-gradient(ellipse at 50% 40%, rgba(70, 90, 240, .55), transparent 65%), var(--cobalt-dk); display: grid; place-items: end center; overflow: hidden; }
    .art img { height: 92vh; max-width: 92%; object-fit: contain; }
    .side { display: flex; flex-direction: column; justify-content: center; padding: 48px clamp(24px, 6vw, 88px); }
    .lockup { display: flex; align-items: center; gap: 16px; margin-bottom: 36px; }
    .lockup img { width: 56px; height: 66px; }
    .lockup b { display: block; font-size: 32px; font-weight: 500; letter-spacing: .14em; line-height: 1.1; color: var(--silver-hi); }
    .lockup span { display: block; font-size: 12px; letter-spacing: .32em; color: var(--silver); margin-top: 4px; }
    h1 { font-size: clamp(36px, 5vw, 60px); font-weight: 300; margin: 0; line-height: 1.1; letter-spacing: .02em; }
    p { color: var(--muted); margin: 12px 0 32px; }
    .go { display: flex; gap: 12px; flex-wrap: wrap; }
    .go a { flex: 1; min-width: 180px; text-decoration: none; padding: 14px 18px; border: 1px solid var(--silver); color: var(--ink); background: var(--silver); text-align: center; letter-spacing: .04em; }
    .go a.ghost { background: transparent; color: var(--text); border-color: var(--line); }
    .go a:hover { border-color: var(--silver-hi); }
    .go small { display: block; font-size: 11px; opacity: .7; letter-spacing: .08em; }
    footer { margin-top: 48px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--text); }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } .art { height: 46vh; } .art img { height: 44vh; } }
  </style>
</head>
<body>
  <main>
    <div class="art"><img src="/static/assets/whale-girl.png" alt=""></div>
    <div class="side">
      <div class="lockup"><img src="/static/assets/krino-mark.svg" alt=""><div><b>决策矩阵</b><span>KRINO MATRIX</span></div></div>
      <h1>KRINO WORLD</h1>
      <p>和会记得你的 AI 角色聊天。<br>Chat with AI characters who remember you.</p>
      <div class="go">
        <a href="https://cn.krinomatrix.com">进入国内版<small>中国大陆</small></a>
        <a class="ghost" href="https://app.krinomatrix.com">Enter Global<small>INTERNATIONAL</small></a>
      </div>
      <footer>杭州决策矩阵科技有限公司 · Hangzhou Krino Matrix Tech Co., Ltd.<br><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">浙ICP备2026093639号</a></footer>
    </div>
  </main>
</body>
</html>
