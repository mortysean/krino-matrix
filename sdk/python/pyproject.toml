[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "krino-world"
version = "0.1.0"
description = "Python client for the KRINO WORLD API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.25"]

[project.urls]
Homepage = "https://krinomatrix.com"
Source = "https://github.com/mortysean/krino-matrix"

[tool.setuptools]
packages = ["krino_world"]
